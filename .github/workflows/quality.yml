name: Quality and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and unit checks
        run: |
          set -eu
          for script in install.sh files/usr/bin/tarm files/usr/share/tarm/core.sh tools/ci-build.sh tools/ci-release.sh; do
            sh -n "$script"
          done
          node --check luci-app-tarm/htdocs/luci-static/resources/view/tarm/main.js
          sh tests/core.sh
          sh tests/subscription-fail-closed.sh

  openwrt-packages:
    name: OpenWrt ${{ matrix.release }} ramips/${{ matrix.subtarget }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 24.10.8
            subtarget: mt76x8
            format: ipk
            sdk_archive: openwrt-sdk-24.10.8-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 14e11075658b7186441ac853a91d6ba150cb7fadf948f7d4ce0946109322f8d3
          - release: 25.12.5
            subtarget: mt76x8
            format: apk
            sdk_archive: openwrt-sdk-25.12.5-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: b44636e0a53f0d769cbce64edb9ca3831e1a9ecdc8c53a5caf128884be6c490e
          - release: 24.10.8
            subtarget: mt7621
            format: ipk
            sdk_archive: openwrt-sdk-24.10.8-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 9dd11b0517883b016ad7684f5c408a3483eec5b2455b2ffe004c9edd84063e45
          - release: 25.12.5
            subtarget: mt7621
            format: apk
            sdk_archive: openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 9962084f4131610e90e48bc864c6ceade0b238f15f335de5f672910532b20e9c
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify packages
        env:
          OPENWRT_RELEASE: ${{ matrix.release }}
          OPENWRT_TARGET: ramips
          OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          SDK_ARCHIVE: ${{ matrix.sdk_archive }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
          CI_WORK_DIR: ${{ runner.temp }}/tarm-sdk
          CI_OUTPUT_DIR: ${{ github.workspace }}/ci-artifacts/openwrt-${{ matrix.release }}-ramips-${{ matrix.subtarget }}
        run: sh tools/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.release }}-ramips-${{ matrix.subtarget }}
          if-no-files-found: error
          path: ci-artifacts/openwrt-${{ matrix.release }}-ramips-${{ matrix.subtarget }}/*

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [static, openwrt-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          test "$(git rev-list -n 1 FETCH_HEAD)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-24.10.8-ramips-mt76x8
          path: ci-artifacts/openwrt-24.10.8-ramips-mt76x8
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12.5-ramips-mt76x8
          path: ci-artifacts/openwrt-25.12.5-ramips-mt76x8
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-24.10.8-ramips-mt7621
          path: ci-artifacts/openwrt-24.10.8-ramips-mt7621
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12.5-ramips-mt7621
          path: ci-artifacts/openwrt-25.12.5-ramips-mt7621
      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
          CI_RELEASE_DIR: ${{ runner.temp }}/tarm-release
        run: sh tools/ci-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CI_RELEASE_DIR: ${{ runner.temp }}/tarm-release
        run: |
          set -eu
          gh release create "$RELEASE_TAG" "$CI_RELEASE_DIR"/* \
            --verify-tag --title "TARM ${RELEASE_TAG#v}" --generate-notes
